<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Bilibili · 600×800 焦点适配版 v0.2</title>
<!--
  严格依据 requirements.md (v0.1) 实现的 Bilibili 600×800 眼镜焦点适配服务
  分层架构：BilibiliProvider → PlaybackSession → PlayerAdapter (DemoMediaAdapter / BiliIframeAdapter) → FocusView
  空间预算：600×800 逻辑像素，四周 32px 安全区 → 内容 536×736；
    观看页：页头48 + 视频302 + 主控64 + 标题作者64 + 次级64 + 底部提示40 + 间距48 = 730 ≤ 736
  焦点规范：
    · 主入口 ≤ 4 个（继续看 / 推荐 / 搜索 / 我的）；每页单列单任务；同屏焦点建议 ≤ 6
    · 稳定焦点 ID（如 bili:player:pause）；默认焦点在「播放/暂停」
    · 进度条确认进入调节模式（左右 ±10s，预览期暂停，确认提交，返回恢复原时间点）
    · 返回链：取消调节 → 关闭面板 → 退出沉浸 → 返回列表 → 系统
    · 水平镜像仅变换视频层，字幕与控制条绝不反转
    · 跨域官方 iframe 未开放控制协议时，如实返回能力矩阵与 unavailableReason，不放假按钮
-->
<style>
  :root{
    --bg:#000;
    --panel:rgba(28,29,35,.94);
    --panel-hi:rgba(46,48,58,.98);
    --line:rgba(255,255,255,.09);
    --txt:#e6e6e6;
    --sub:#a4a7b0;
    --dim:#717580;
    --acc:#fb7299;
    --acc-glow:rgba(251,114,153,.46);
    --acc-soft:rgba(251,114,153,.16);
    --cyan:#23ade5;
    --cyan-soft:rgba(35,173,229,.16);
    --warn:#f5b856;
    --err:#f28b82;
    --safe:32px;
    --r-lg:24px; --r-md:16px; --r-sm:12px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --dur:160ms;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Noto Sans SC","Google Sans",Roboto,"Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
  button,a{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;text-decoration:none}
  .f{outline:none}
  svg{display:block}

  /* 600×800 固定逻辑画布 + 四周 32px 安全区 → 内容宽 536，可用高 736 */
  #app{position:relative;width:min(100vw,600px);height:min(100dvh,800px);margin:0 auto;overflow:hidden;isolation:isolate;background:#000}
  @media (min-width:660px) and (min-height:860px){
    body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b0c10}
    #app{width:600px;height:800px;margin:0;border-radius:10px;box-shadow:0 0 0 1px #2d2f3a,0 28px 80px rgba(0,0,0,.7)}
    #frameMeta{display:flex}
  }
  #frameMeta{display:none;gap:14px;align-items:center;color:#6c707b;font-size:13px}
  #frameMeta b{color:var(--acc);font-weight:500}

  /* 透视模拟（B 键） */
  #world{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .35s;
    background:
      radial-gradient(120% 60% at 50% 110%,#3d4a2f 0 40%,transparent 41%),
      radial-gradient(40% 30% at 20% 30%,#f3e6c8 0,transparent 70%),
      linear-gradient(180deg,#9cc3e6 0%,#d7e6f0 45%,#7c8a6a 46%,#55603f 100%)}
  #app.pt #world{opacity:1}
  #app.pt #shell{mix-blend-mode:screen}

  /* 安全区容器：536 × 736 */
  #shell{position:absolute;inset:var(--safe);z-index:1;display:flex;flex-direction:column;background:#000}

  /* ---------- 页头：固定 48px ---------- */
  #top{flex:none;height:48px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .tabs{flex:1;height:48px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tab{flex:1;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--sub);
    transition:background var(--dur),color var(--dur),box-shadow var(--dur)}
  .tab.on{color:var(--txt);background:rgba(255,255,255,.1)}
  .tab:focus{color:#17090e;background:var(--acc);font-weight:600;box-shadow:0 0 18px var(--acc-glow)}
  .hdr{flex:1;height:48px;display:flex;align-items:center;gap:10px;min-width:0}
  .tag{flex:none;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
  .tag.demo{background:var(--cyan-soft);color:var(--cyan)}
  .tag.warn{background:rgba(245,184,86,.18);color:var(--warn)}
  .hdr h2{margin:0;font-size:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}

  /* ---------- 主视图 ---------- */
  #view{flex:1;position:relative;min-height:0;overflow:hidden}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:2px 0 12px}
  .scroll::-webkit-scrollbar{display:none}
  .banner{padding:10px 14px;border-radius:var(--r-md);background:rgba(35,173,229,.1);border:1px solid rgba(35,173,229,.22);
    font-size:14px;color:var(--sub);line-height:1.45;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .banner b{color:var(--cyan);font-weight:500}
  .banner.err{background:rgba(242,139,130,.12);border-color:rgba(242,139,130,.3);color:var(--err)}
  .sec-h{font-size:15px;color:var(--dim);margin:10px 4px 8px;display:flex;justify-content:space-between}

  /* 单列卡片（每页单列单任务，避免多列拼盘） */
  .vlist{display:flex;flex-direction:column;gap:10px}
  .vitem{width:100%;display:flex;gap:14px;align-items:center;padding:10px;border-radius:var(--r-lg);background:var(--panel);
    border:1px solid var(--line);transition:background var(--dur),box-shadow var(--dur),transform var(--dur) var(--ease)}
  .vitem:focus{background:var(--panel-hi);box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc-glow)}
  .vthumb{position:relative;width:168px;aspect-ratio:16/9;flex:none;border-radius:var(--r-sm);overflow:hidden;
    background:linear-gradient(135deg,hsl(var(--h) 42% 24%),hsl(calc(var(--h) + 32) 34% 12%))}
  .vthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vthumb .dur{position:absolute;right:6px;bottom:6px;font-size:12px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.76);color:#e6e6e6;font-variant-numeric:tabular-nums}
  .vthumb .kind{position:absolute;left:6px;top:6px;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.76);color:var(--cyan)}
  .vthumb .kind.lock{color:var(--warn)}
  .vthumb .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.22)}
  .vthumb .pbar i{display:block;height:100%;background:var(--acc)}
  .vmeta{min-width:0;flex:1}
  .vmeta .t{font-size:17px;line-height:1.3;max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--txt)}
  .vmeta .m{margin-top:5px;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vmeta .r{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--sub)}
  .pill.pink{background:var(--acc-soft);color:var(--acc)}
  .pill.cy{background:var(--cyan-soft);color:var(--cyan)}

  /* 通用单列选项行 */
  .opt{width:100%;min-height:58px;padding:12px 16px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background var(--dur),box-shadow var(--dur)}
  .opt:focus{background:var(--acc);color:#17090e;box-shadow:0 0 20px var(--acc-glow)}
  .opt:focus .osub,.opt:focus .oval{color:#351520}
  .opt[aria-disabled="true"]{opacity:.48}
  .otitle{font-size:17px;font-weight:500}
  .osub{font-size:13px;color:var(--sub);margin-top:2px}
  .oval{font-size:15px;color:var(--cyan);flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
  .chip{height:40px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:15px;color:var(--sub);display:inline-flex;align-items:center}
  .chip:focus{background:var(--acc);color:#17090e;font-weight:600;box-shadow:0 0 16px var(--acc-glow)}
  .sbox{position:relative;margin-bottom:8px}
  .sbox input{width:100%;height:52px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);
    font:inherit;font-size:17px;padding:0 18px 0 46px}
  .sbox input:focus{box-shadow:0 0 0 3px var(--acc);background:var(--panel-hi)}
  .sbox svg{position:absolute;left:16px;top:15px;width:22px;height:22px;fill:var(--sub)}

  /* ---------- 观看页：严格 730px ≤ 736px 预算（零溢出） ----------
     页头48 + 间距10 + 视频302 + 间距10 + 进度/主控64 + 间距8 + 标题作者64 + 间距8 + 次级入口64 + 间距8 + 底部提示40 = 626 ~ 730 */
  .watch-wrap{height:100%;display:flex;flex-direction:column;gap:8px}
  .stage{position:relative;width:536px;height:302px;flex:none;border-radius:var(--r-lg);overflow:hidden;background:#07080c;border:1px solid var(--line)}
  /* 独立视频变换层：镜像只作用在 #vlayer，绝不反转字幕与控制层 */
  #vlayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform 200ms var(--ease)}
  #vlayer.mirror{transform:scaleX(-1)}
  #vcanvas{display:block;max-width:100%;max-height:100%;background:#0a0c12}
  #vcanvas.fill{width:100%;height:100%;object-fit:cover}
  #biliFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* 稀疏弹幕层（仅顶部安全区，绝不挡底部字幕） */
  #dmLayer{position:absolute;left:14px;right:14px;top:12px;height:66px;pointer-events:none;overflow:hidden;z-index:2}
  .dm{position:absolute;white-space:nowrap;font-size:16px;color:rgba(230,230,230,.82);text-shadow:0 1px 4px rgba(0,0,0,.95);
    animation:dmMove 7s linear forwards}
  @keyframes dmMove{from{left:100%}to{left:-120%}}
  /* 字幕层：底部安全区，最多两行，高对比度，独立于镜像层 */
  #subLayer{position:absolute;left:18px;right:18px;bottom:14px;z-index:3;pointer-events:none;display:flex;justify-content:center}
  .sub-txt{background:rgba(0,0,0,.78);color:#f0f0f0;padding:5px 12px;border-radius:10px;text-align:center;line-height:1.35;
    max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub-txt.md{font-size:17px}.sub-txt.lg{font-size:21px}
  /* 视频角标状态（镜像 / 倍速 / 模式） */
  #vbadges{position:absolute;left:12px;top:10px;z-index:4;display:flex;gap:6px;pointer-events:none}
  .vb{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.72);color:var(--txt);border:1px solid rgba(255,255,255,.14)}
  .vb.pink{color:var(--acc);border-color:rgba(251,114,153,.45)}
  .vb.warn{color:var(--warn);border-color:rgba(245,184,86,.45)}
  /* 受限 / 错误覆盖提示（不抢焦点） */
  #voverlay{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.76);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px}
  #voverlay.show{display:flex}
  #voverlay b{font-size:19px;color:var(--warn)}
  #voverlay p{margin:0;font-size:15px;color:var(--sub);line-height:1.45}

  /* 进度条（可聚焦进入调节模式） */
  .seek-btn{width:100%;height:34px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);transition:box-shadow var(--dur),background var(--dur)}
  .seek-btn:focus{box-shadow:0 0 0 3px var(--acc);background:var(--panel-hi)}
  .seek-btn.adjusting{box-shadow:0 0 0 3px var(--cyan),0 0 22px rgba(35,173,229,.45);background:rgba(35,173,229,.16)}
  .seek-btn[aria-disabled="true"]{opacity:.45}
  .sbar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--acc);border-radius:3px}
  .seek-btn.adjusting .sbar i{background:var(--cyan)}
  .stime{font-size:14px;font-variant-numeric:tabular-nums;color:var(--sub);min-width:98px;text-align:right}
  .sadj{font-size:12px;color:var(--cyan);font-weight:600;display:none}
  .seek-btn.adjusting .sadj{display:inline}

  /* 主控制行（60px）：后退10秒 / 播放暂停 / 前进10秒 */
  .ctrl-row{height:60px;flex:none;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
  .cbtn{height:60px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;color:var(--txt);transition:all var(--dur)}
  .cbtn svg{width:22px;height:22px;fill:currentColor}
  .cbtn.pri{background:rgba(251,114,153,.16);border-color:rgba(251,114,153,.3)}
  .cbtn:focus{background:var(--acc);color:#17090e;font-weight:600;box-shadow:0 0 22px var(--acc-glow)}
  .cbtn[aria-disabled="true"]{opacity:.42}

  /* 标题与作者（60px，最多两行，绝不压缩字体） */
  .wmeta{height:60px;flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 4px}
  .wmeta h1{margin:0;font-size:18px;line-height:1.28;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wmeta .sub{margin-top:4px;font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wmeta .st{color:var(--cyan)}
  .wmeta .st.err{color:var(--err)}

  /* 次级入口行（58px）：选集 / 播放设置 / 更多 */
  .sub-row{height:58px;flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .sbtn{height:58px;border-radius:var(--r-md);background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;color:var(--sub);transition:all var(--dur)}
  .sbtn:focus{background:var(--acc);color:#17090e;font-weight:600;box-shadow:0 0 20px var(--acc-glow)}

  /* 沉浸全屏（仅隐藏页面信息，固定 600×800 画布不旋转） */
  #app.immersive #top,#app.immersive .seek-btn,#app.immersive .ctrl-row,#app.immersive .wmeta,#app.immersive .sub-row,#app.immersive #hints{
    opacity:0;pointer-events:none;transition:opacity .4s}
  #app.immersive .stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,600px);height:auto;aspect-ratio:16/9;z-index:4;border-radius:0;border:0}
  #app.immersive .stage.vert{height:min(100dvh,640px);width:360px;aspect-ratio:9/16}

  /* ---------- 底部提示：固定 40px ---------- */
  #hints{flex:none;height:40px;display:flex;align-items:center;gap:12px;margin-top:8px;font-size:14px;color:var(--dim)}
  #hints .h{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #hints kbd{font:inherit;font-size:12px;min-width:22px;height:22px;padding:0 5px;border-radius:6px;border:1px solid rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;color:var(--sub)}
  #clock{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--sub)}

  /* ---------- 单一弹层面板（设置 / 选集 / 更多 / 手机继续看 / 详情热评） ---------- */
  #scrim{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;transition:opacity var(--dur)}
  #sheet{position:absolute;left:var(--safe);right:var(--safe);top:var(--safe);bottom:var(--safe);z-index:11;
    background:#121318;border:1px solid rgba(255,255,255,.12);border-radius:var(--r-lg);padding:18px;
    display:flex;flex-direction:column;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity var(--dur),transform var(--dur) var(--ease)}
  #app.sheet #scrim{opacity:1;pointer-events:auto}
  #app.sheet #sheet{opacity:1;transform:none;pointer-events:auto}
  .sh-hdr{flex:none;display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .sh-hdr h3{margin:0;font-size:20px;font-weight:500}
  .sh-hdr span{font-size:13px;color:var(--dim)}
  .sh-body{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:8px}
  .sh-body::-webkit-scrollbar{display:none}
  .qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;border-radius:var(--r-md);background:var(--panel);text-align:center}
  .qr-box svg{width:156px;height:156px;border-radius:12px;background:#e6e6e6;padding:10px}
  .qr-box code{font-size:13px;color:var(--cyan);word-break:break-all}

  /* Toast */
  #toast{position:absolute;left:50%;top:44px;z-index:20;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
    background:var(--panel-hi);border:1px solid rgba(251,114,153,.4);color:var(--txt);font-size:15px;padding:9px 16px;border-radius:999px;white-space:nowrap;
    transition:opacity var(--dur),transform var(--dur) var(--ease)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* 边界回弹 */
  .bump-left{animation:bl 200ms var(--ease)}.bump-right{animation:br 200ms var(--ease)}
  .bump-up{animation:bu 200ms var(--ease)}.bump-down{animation:bd 200ms var(--ease)}
  @keyframes bl{40%{transform:translateX(-6px)}}@keyframes br{40%{transform:translateX(6px)}}
  @keyframes bu{40%{transform:translateY(-5px)}}@keyframes bd{40%{transform:translateY(5px)}}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="frameMeta">
  <b>600 × 800（安全区 536 × 736）</b>
  <span>↑↓←→ 移焦</span><span>Enter 确认/调节</span><span>Esc 逐层返回</span><span>I 沉浸</span><span>B 透视模拟</span>
</div>
<div id="app">
  <div id="world" aria-hidden="true"></div>
  <div id="shell">
    <header id="top"></header>
    <main id="view"></main>
    <footer id="hints"></footer>
  </div>
  <div id="scrim"></div>
  <aside id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></aside>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';

/* =========================================================================
   1. BilibiliProvider（数据源层：明确区分演示素材与真实账号，不伪装已接入）
   覆盖需求文档七节验收样本：普通视频 / 多P / 竖屏9:16 / 带字幕 / 番剧受限
   ========================================================================= */
const VIDEOS = [
  {
    bvid:'BV1jE41137eu', cid:164144278, zone:'科技极客', owner:'稚晖君', duration:239, aspect:'16:9',
    title:'【自制】技术宅耗时三个月，自制B站最强小电视',
    desc:'野生技术宅硬核手工，从原理图、PCB 到外壳与嵌入式系统的完整记录。',
    pic:'https://i0.hdslb.com/bfs/archive/e45dcea884e87613b327a5ec34a16ce962309327.jpg@480w_270h_1c.webp',
    hue:202, rights:{ playable:true, vipOnly:false, offlineAllowed:false },
    parts:[
      { cid:164144278, p:1, title:'P1 外观草图与硬件设计', duration:239 },
      { cid:164144279, p:2, title:'P2 嵌入式固件与屏幕驱动', duration:312 },
      { cid:164144280, p:3, title:'P3 整机装配与桌面实测', duration:195 },

/* =========================================================================
   2. PlayerAdapter 能力协商层（严格禁止对不可控 iframe 暴露假能力）
   ========================================================================= */
function getCapabilities(adapterKind, video) {
  if (video && !video.rights.playable) {
    return {
      canPlay: false, canSeek: false, canRate: false, canMirror: false,
      canSubtitle: false, canDanmaku: false, canOffline: false,
      unavailableReason: video.rights.reason || '内容权限受限',
    };
  }
  if (adapterKind === 'iframe') {
    return {
      canPlay: false, canSeek: false, canRate: false, canMirror: false,
      canSubtitle: false, canDanmaku: false, canOffline: false,
      unavailableReason: '官方跨域 iframe 未开放控制协议；不支持远程暂停/镜像/调速/字幕控制。',
    };
  }
  return {
    canPlay: true, canSeek: true, canRate: true, canMirror: true,
    canSubtitle: !!(video && video.subtitles && video.subtitles.length),
    canDanmaku: true, canOffline: false,
    unavailableReason: '',
    offlineReason: '离线缓存需站点离线授权与持久存储，当前请用手机端完成。',
  };
}

/* =========================================================================
   3. PlaybackSession 状态机
      idle → resolving → ready → playing ↔ paused → ended / error / restricted
   ========================================================================= */
const Session = {
  bvid: null, partIndex: 0, position: 0, duration: 0,
  state: 'idle', errorMsg: '',
  adjusting: false, adjustOrigin: 0, wasPlayingBeforeAdjust: false,
  raf: 0, lastTs: 0, dmTick: 0,

  load(bvid, partIndex = null) {
    this.stopLoop();
    const v = BY[bvid]; if (!v) return;
    this.bvid = bvid;
    const saved = Store.progress[bvid];
    this.partIndex = partIndex !== null ? partIndex : (saved ? Math.min(saved.partIndex || 0, v.parts.length - 1) : 0);
    const part = v.parts[this.partIndex];
    this.duration = part.duration;
    this.position = (partIndex === null && saved && saved.partIndex === this.partIndex && saved.position < part.duration - 3)
      ? saved.position : 0;
    this.adjusting = false;
    this.errorMsg = '';

    if (!v.rights.playable) {
      this.state = 'restricted';
      this.errorMsg = v.rights.reason;
      return;
    }
    if (Store.networkOffline) {
      this.state = 'error';
      this.errorMsg = '当前网络不可用，已保留上次播放进度。恢复网络后可继续。';
      return;
    }
    this.state = 'ready'; // B032：首播需用户确认，不抢跑
  },

  savePos() {
    if (!this.bvid) return;
    Store.progress[this.bvid] = { partIndex: this.partIndex, position: Math.floor(this.position), updatedAt: Date.now() };
    saveStore();
  },

  togglePlay() {
    const v = BY[this.bvid]; if (!v) return;
    const caps = getCapabilities(Store.adapter, v);
    if (!caps.canPlay) return toast(caps.unavailableReason);
    if (Store.networkOffline) { this.setError('网络已断开，已保留当前进度（焦点未移动）'); return; }
    if (this.state === 'ended') this.position = 0;
    if (this.state === 'playing') {
      this.state = 'paused'; this.stopLoop(); this.savePos();
    } else {
      this.state = 'playing'; this.lastTs = performance.now(); this.startLoop(); scheduleImmersive();
    }
    syncWatchUI();
  },

  step(delta) {
    const v = BY[this.bvid]; if (!v) return;
    if (!getCapabilities(Store.adapter, v).canSeek) return toast('当前播放器不支持步进');
    this.position = Math.max(0, Math.min(this.duration, this.position + delta));
    this.savePos();
    syncWatchUI(); drawDemoFrame();
  },

  beginAdjust() {
    const v = BY[this.bvid]; if (!v) return;
    if (!getCapabilities(Store.adapter, v).canSeek) return toast('官方嵌入暂不支持进度调节');
    this.adjusting = true;
    this.adjustOrigin = this.position;
    this.wasPlayingBeforeAdjust = (this.state === 'playing');
    if (this.wasPlayingBeforeAdjust) { this.state = 'paused'; this.stopLoop(); } // 预览期暂停
    syncWatchUI();
    toast('调节模式：←/→ ±10秒 · Enter 确认 · Esc 取消');
  },

  commitAdjust() {
    this.adjusting = false;
    this.savePos();
    if (this.wasPlayingBeforeAdjust && !Store.networkOffline) {
      this.state = 'playing'; this.lastTs = performance.now(); this.startLoop();
    }
    syncWatchUI();
    toast('已定位到 ' + fmt(this.position));
  },

  cancelAdjust() {
    this.position = this.adjustOrigin;
    this.adjusting = false;
    if (this.wasPlayingBeforeAdjust && !Store.networkOffline) {
      this.state = 'playing'; this.lastTs = performance.now(); this.startLoop();
    }
    syncWatchUI(); drawDemoFrame();
    toast('已取消调节，恢复至 ' + fmt(this.position));
  },

  setError(msg) {
    this.state = 'error'; this.errorMsg = msg; this.stopLoop(); this.savePos();
    syncWatchUI(); // 第 63 行：只更新状态提示，绝不自动把焦点移到重试
  },

  startLoop() {
    this.stopLoop();
    const tick = (now) => {
      if (this.state !== 'playing') return;
      const dt = Math.min(0.25, (now - this.lastTs) / 1000);
      this.lastTs = now;
      this.position += dt * Store.prefs.rate;
      if (this.position >= this.duration) {
        if (Store.prefs.loop) {
          this.position = 0;
        } else {
          this.position = this.duration;
          this.state = 'ended';
          this.stopLoop(); this.savePos(); exitImmersive(); syncWatchUI(); drawDemoFrame();
          toast('播放结束 · 按 Enter 重播或选择下一P');
          return;
        }
      }
      this.dmTick += dt;
      if (this.dmTick > (Store.prefs.dmPreset === 'standard' ? 2.4 : 4.5)) {
        this.dmTick = 0; spawnDanmaku();
      }
      if (Math.floor(this.position) % 3 === 0) this.savePos();
      syncWatchTimeOnly();
      drawDemoFrame();
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
  stopLoop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
};

function pushRoute(entry) {
  snapshotRoute(topRoute());
  routeStack.push(entry);
  render();

function popRoute() {
  if (routeStack.length <= 1) return false;
  if (topRoute().name === 'watch') { Session.savePos(); Session.stopLoop(); }
  routeStack.pop();
  render();
  return true;
}
function switchTab(t) {
  if (t === curTab && routeStack.length === 1) return;
  if (topRoute().name === 'watch') { Session.savePos(); Session.stopLoop(); }
  curTab = t;
  routeStack = [{ name: t, focusId: `bili:tab:${t}` }];
  render();
}

  const a = document.activeElement, sc = viewEl.querySelector('.scroll');
  r.saved = { fid: a && a.dataset ? a.dataset.fid : null, top: sc ? sc.scrollTop : 0 };
}

function render() {

    : `<div class="hdr"><span class="tag ${scr.crumbClass||''}">${esc(scr.crumb)}</span><h2>${esc(scr.title)}</h2></div>`;
  viewEl.innerHTML = scr.html;
  hintsEl.innerHTML = scr.hints.map(([k,l]) => `<span class="h"><kbd>${k}</kbd>${l}</span>`).join('') + `<span id="clock"></span>`;
  tickClock();

  const sc = viewEl.querySelector('.scroll');
  if (sc && r.saved) sc.scrollTop = r.saved.top || 0;

  requestAnimationFrame(() => {
    const targetId = (r.saved && r.saved.fid) || r.focusId || scr.defaultFocus;
    const el = targetId && byFid(targetId);

}

/* =========================================================================
   6. 播放页状态同步 & 可控演示画布（独立视频层，镜像绝不反转字幕）
   ========================================================================= */
function syncWatchUI() {
  if (topRoute().name !== 'watch') return;
  const v = BY[Session.bvid]; if (!v) return;
  const caps = getCapabilities(Store.adapter, v);
  const pb = $('#playBtn');
  if (pb) {
    const playing = Session.state === 'playing';
    pb.innerHTML = `${ic(playing ? 'pause' : 'play')}<span>${playing ? '暂停' : Session.state === 'ended' ? '重播' : '播放'}</span>`;
  }
  const sb = $('#seekBtn');
  if (sb) sb.classList.toggle('adjusting', Session.adjusting);
  const vl = $('#vlayer');
  if (vl) vl.classList.toggle('mirror', Store.prefs.mirror && caps.canMirror);
  const vc = $('#vcanvas');
  if (vc) vc.classList.toggle('fill', Store.prefs.fit === 'fill');

  const badges = [];
  if (Store.adapter === 'iframe') badges.push('<span class="vb warn">官方嵌入 · 仅浏览</span>');
  else badges.push('<span class="vb">演示媒体</span>');
  if (Store.prefs.mirror && caps.canMirror) badges.push('<span class="vb pink">镜像中</span>');
  if (Store.prefs.rate !== 1 && caps.canRate) badges.push(`<span class="vb pink">${Store.prefs.rate}x</span>`);
  if (Store.prefs.loop && caps.canPlay) badges.push('<span class="vb">单集循环</span>');
  const vb = $('#vbadges'); if (vb) vb.innerHTML = badges.join('');

  const ov = $('#voverlay');
  if (ov) {
    const showOv = Session.state === 'restricted' || Session.state === 'error';
    ov.classList.toggle('show', showOv);
    if (showOv) {
      $('#vovTitle').textContent = Session.state === 'restricted' ? '内容权限受限' : '网络或播放异常';
      $('#vovMsg').textContent = Session.errorMsg;
    }
  }
  const ws = $('#wstatus');
  if (ws) {
    const map = { idle:'空闲', ready:'就绪（按播放开始）', playing:'播放中', paused:'已暂停', ended:'播放结束', restricted:'权限受限', error:'已断网 · 进度已保留' };
    ws.textContent = Session.adjusting ? '进度调节中（←/→ ±10s）'
      : Store.adapter === 'iframe' && v.rights.playable ? '官方嵌入（不支持远程暂停/镜像）'
      : (map[Session.state] || Session.state);
    ws.classList.toggle('err', Session.state === 'error' || Session.state === 'restricted');
  }
  syncWatchTimeOnly();
}

function syncWatchTimeOnly() {
  const fill = $('#sfill'), st = $('#stime');
  if (fill) fill.style.width = Session.duration ? (Session.position / Session.duration * 100) + '%' : '0%';
  if (st) st.textContent = `${fmt(Session.position)} / ${fmt(Session.duration)}`;

  // 底部安全区字幕（最多两行，绝不随视频层镜像）
  const subEl = $('#subLayer'), v = BY[Session.bvid];
  if (!subEl || !v) return;
  const caps = getCapabilities(Store.adapter, v);
  if (!caps.canSubtitle || !Store.prefs.subOn || Session.state === 'restricted') { subEl.innerHTML = ''; return; }
  const t = Session.position;
  const hit = v.subtitles.find(([s,e]) => t >= s && t < e);
  subEl.innerHTML = hit ? `<div class="sub-txt ${Store.prefs.subSize}">${esc(hit[2]).replace(/\n/g,'<br>')}</div>` : '';
}

function spawnDanmaku() {
  if (topRoute().name !== 'watch' || Store.adapter !== 'demo' || Store.prefs.dmPreset === 'off') return;
  const v = BY[Session.bvid], layer = $('#dmLayer');
  if (!v || !layer || !v.danmaku.length) return;
  const maxLines = Store.prefs.dmPreset === 'sparse' ? 1 : 2;
  if (layer.children.length >= maxLines) return;
  const text = v.danmaku[Math.floor(Math.random() * v.danmaku.length)];
  const el = document.createElement('div');
  el.className = 'dm';
  el.style.top = (layer.children.length * 26) + 'px';
  el.textContent = text;
  layer.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function drawDemoFrame() {
  const c = $('#vcanvas'), v = BY[Session.bvid];
  if (!c || !v) return;
  const ctx = c.getContext('2d'), w = c.width, h = c.height, t = Session.position;
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${v.hue},42%,18%)`);
  g.addColorStop(1, `hsl(${(v.hue + 48) % 360},36%,9%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  // 动态网格 + 不对称左右方向标记（用于直观验证水平镜像！）
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  const cx = w * 0.5 + Math.sin(t * 1.4) * (w * 0.16);
  const cy = h * 0.44 + Math.cos(t * 1.1) * (h * 0.08);
  ctx.fillStyle = 'rgba(251,114,153,0.22)';
  ctx.beginPath(); ctx.arc(cx, cy, Math.min(w, h) * 0.16, 0, Math.PI * 2); ctx.fill();

  // 左右不对称方向指示（开镜像后会直观互换，而下方字幕保持正向）
  ctx.fillStyle = 'rgba(230,230,230,0.85)';
  ctx.font = '600 18px sans-serif';
  ctx.fillText('◀ 画面左 (L)', 22, h * 0.46);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(35,173,229,0.9)';
  ctx.fillText('画面右 (R) ▶', w - 22, h * 0.46);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(230,230,230,0.65)';
  ctx.font = '500 14px monospace';
  ctx.fillText(`${v.bvid} · P${v.parts[Session.partIndex].p} · ${fmt(t)}`, w / 2, h * 0.24);
  ctx.textAlign = 'left';
}

/* =========================================================================
   7. 单一弹层面板系统（设置按任务分组单列、选集、更多、手机协同、热评）
      关闭时自动恢复触发按钮焦点（第四节第 5 条）
   ========================================================================= */
function openSheet(spec, anchorEl) {
  sheetStack.push({ spec, anchor: anchorEl || document.activeElement });
  renderSheet();
}
function replaceSheet(spec) {
  if (!sheetStack.length) return;
  sheetStack[sheetStack.length - 1].spec = spec;
  renderSheet();
}
function closeSheet() {
  if (!sheetStack.length) return false;
  const popped = sheetStack.pop();
  if (sheetStack.length) {
    renderSheet();
  } else {
    app.classList.remove('sheet');
    sheetEl.setAttribute('aria-hidden', 'true');
    $('#shell').inert = false;
    if (popped.anchor && document.contains(popped.anchor)) focusEl(popped.anchor);
    else focusFirst();
  }
  return true;
}
function renderSheet() {
  const { spec } = sheetStack[sheetStack.length - 1];
  app.classList.add('sheet');
  sheetEl.setAttribute('aria-hidden', 'false');
  $('#shell').inert = true;
  sheetEl.innerHTML = `<div class="sh-hdr"><h3>${esc(spec.title)}</h3><span>${esc(spec.sub || 'Esc 返回')}</span></div><div class="sh-body">${spec.html}</div>`;
  requestAnimationFrame(() => {
    const el = (spec.focusId && byFid(spec.focusId)) || sheetEl.querySelector('.f');
    if (el) focusEl(el);
  });
}

      <div><div class="otitle">${later ? '移出稍后再看' : '加入稍后再看'}</div><div class="osub">个人待看队列（不等于离线缓存）</div></div>
      <span class="oval">${later ? '已在队列' : '加入'}</span>
    </button>
    <button class="f opt" data-fid="bili:more:comments" data-sact="openComments">
      <div><div class="otitle">详情与热评摘要</div><div class="osub">单列阅读；长评论与回复转手机完成</div></div>
      <span class="oval">${v.comments.length} 条</span>
    </button>
    <button class="f opt" data-fid="bili:more:phone" data-sact="openPhoneVideo">
      <div><div class="otitle">用手机继续看</div><div class="osub">二维码与深链接（含当前分P与时间点）</div></div>
      <span class="oval">协同</span>
    </button>
    <button class="f opt" data-fid="bili:more:immersive" data-sact="enterImmersive">
      <div><div class="otitle">沉浸观看（隐藏信息）</div><div class="osub">保持 600×800 画布不旋转；按任意确认/Esc 退出</div></div>
      <span class="oval">进入</span>
    </button>`;
  openSheet({ title: '更多操作', html }, anchor);
}

function openPhoneHandoff(v) {
  const t = v ? Math.floor(Session.position) : 0;
  const url = v ? `https://www.bilibili.com/video/${v.bvid}?p=${Session.partIndex + 1}&t=${t}` : 'https://www.bilibili.com/';
  // 轻量确定性二维码占位矩阵（纯 SVG，无外部依赖）
  let rects = '';
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    const corner = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    const bit = corner || (((x*31 + y*17 + (v?v.cid:7)) % 5) < 2);
    if (bit) rects += `<rect x="${x*10}" y="${y*10}" width="9" height="9" rx="1.5" fill="#111"/>`;
  }
  openSheet({
    title: '用手机继续看',
    html: `<div class="qr-box">
      <svg viewBox="0 0 110 110" aria-hidden="true">${rects}</svg>
      <div style="font-size:15px;color:var(--txt)">${v ? `接续 ${v.bvid} · P${Session.partIndex+1} · ${fmt(t)}` : '在手机端完成登录、投币、长评论或离线缓存'}</div>
      <code>${esc(url)}</code>
    </div>
    <a class="f opt" data-fid="bili:phone:open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
      <div><div class="otitle">在浏览器中打开原链接</div><div class="osub">新窗口打开对应 B站页面</div></div>
      <span class="oval">打开 ↗</span>
    </a>`
  }, document.activeElement);
}

function openCommentsSheet() {
  const v = BY[Session.bvid];
  const html = `
    <div class="banner"><span>${esc(v.desc)}</span></div>
    ${v.comments.map((c,i) => `<button class="f opt" data-fid="bili:cmt:${i}">
      <div><div class="otitle">${esc(c.user)} · 👍 ${c.likes}</div><div class="osub" style="color:var(--txt);margin-top:4px">${esc(c.text)}</div></div>
    </button>`).join('')}
    <button class="f opt" data-fid="bili:cmt:reply" data-sact="openPhoneVideo">
      <div><div class="otitle">发表评论或回复</div><div class="osub">复杂文字输入、表情与 @ 转手机端完成</div></div>
      <span class="oval">手机协同</span>
    </button>`;
  openSheet({ title: '详情与热评摘要', html }, document.activeElement);
}

/* =========================================================================
   8. 空间焦点导航引擎（单一焦点所有者，稳定 ID，边界回弹）
   ========================================================================= */
const byFid = id => document.querySelector(`[data-fid="${CSS.escape(id)}"]`);
function focusables() {
  const scope = sheetStack.length ? sheetEl : $('#shell');
  return [...scope.querySelectorAll('.f')].filter(el => el.offsetParent !== null);
}
function focusEl(el) {
  if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
}
function focusFirst() {
  const list = focusables();
  const el = (sheetStack.length ? list[0] : list.find(x => viewEl.contains(x))) || list[0];
  if (el) focusEl(el);
}
function moveFocus(dir) {
  const cur = document.activeElement, list = focusables();
  if (!list.includes(cur)) { focusFirst(); return; }
  const r = cur.getBoundingClientRect(), cx = (r.left + r.right)/2, cy = (r.top + r.bottom)/2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const c = el.getBoundingClientRect(), ex = (c.left + c.right)/2, ey = (c.top + c.bottom)/2;
    let s;
    if (dir === 'left' || dir === 'right') {
      const p = dir === 'right' ? ex - cx : cx - ex; if (p <= 4) continue;
      const ov = Math.min(c.bottom, r.bottom) - Math.max(c.top, r.top); if (ov <= Math.min(c.height, r.height) * 0.3) continue;
      s = p + Math.abs(ey - cy) * 2;
    } else {
      const p = dir === 'down' ? c.top - r.bottom : r.top - c.bottom; if (p < -Math.min(c.height, r.height) * 0.4) continue;
      const ov = Math.min(c.right, r.right) - Math.max(c.left, r.left);
      s = Math.max(p, 0) * 1.2 + Math.abs(ex - cx) * (ov > 0 ? 0.25 : 1.1);
    }
    if (s < bs) { bs = s; best = el; }
  }
  if (!best) { bump(cur, dir); return; }
  if ((dir === 'up' || dir === 'down') && best.classList.contains('tab') && !cur.classList.contains('tab')) {
    const on = topEl.querySelector('.tab.on'); if (on) best = on;
  }
  focusEl(best);
}
function bump(el, dir) {
  if (!el) return;
  const c = 'bump-' + dir; el.classList.remove(c); void el.offsetWidth; el.classList.add(c);
  setTimeout(() => el.classList.remove(c), 220);
}

/* =========================================================================
   9. 输入路由（严格返回链 + 调节模式 + 沉浸模式）
   ========================================================================= */
const DIRS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
const BACK = new Set(['Escape','GoBack','BrowserBack']);

function handleBack() {
  // 第四节第 5 条：取消调节 → 关闭面板 → 退出沉浸 → 返回列表 → 系统
  if (Session.adjusting) { Session.cancelAdjust(); return; }
  if (closeSheet()) return;
  if (app.classList.contains('immersive')) { exitImmersive(); return; }
  if (popRoute()) return;
  if (curTab !== 'continue') { switchTab('continue'); return; }
  bump(document.activeElement, 'up');
}

document.addEventListener('keydown', e => {
  const k = e.key, inInput = e.target.tagName === 'INPUT';
  resetIdle();
  // 沉浸模式：第一次确认/方向键先唤出控制条，不触发动作（第四节第 6 条）
  if (app.classList.contains('immersive')) {
    e.preventDefault();
    exitImmersive();
    return;
  }
  // 进度调节模式：左右 ±10s，Enter 提交，Esc 恢复原值
  if (Session.adjusting) {
    if (k === 'ArrowLeft') { e.preventDefault(); Session.step(-10); return; }
    if (k === 'ArrowRight') { e.preventDefault(); Session.step(10); return; }
    if (k === 'Enter' || k === ' ') { e.preventDefault(); Session.commitAdjust(); return; }
    if (BACK.has(k) || k === 'Backspace') { e.preventDefault(); Session.cancelAdjust(); return; }
    return;
  }
  if (DIRS[k]) {
    if (inInput && (k === 'ArrowLeft' || k === 'ArrowRight') && e.target.value) return;
    e.preventDefault(); moveFocus(DIRS[k]); return;
  }
  if (BACK.has(k) || (k === 'Backspace' && !inInput)) { e.preventDefault(); handleBack(); return; }
  if (k === 'Enter' || k === ' ') {
    if (inInput) { if (k === 'Enter') { e.preventDefault(); const first = viewEl.querySelector('.vitem'); if (first) focusEl(first); } return; }
    e.preventDefault();
    const el = document.activeElement;
    if (el && el.classList.contains('f')) el.click(); else focusFirst();
    return;
  }
  if ((k === 'i' || k === 'I') && !inInput && topRoute().name === 'watch' && !sheetStack.length) {
    e.preventDefault(); enterImmersive();
  }
  if ((k === 'b' || k === 'B') && !inInput) {
    app.classList.toggle('pt'); toast(app.classList.contains('pt') ? '透视模拟：开（加色混合）' : '透视模拟：关');
  }
});

app.addEventListener('click', e => {
  resetIdle();
  if (app.classList.contains('immersive')) { exitImmersive(); return; }
  const el = e.target.closest('.f'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'A') return;
  if (document.activeElement !== el) focusEl(el);
  const d = el.dataset;
  if (d.tab) return switchTab(d.tab);
  if (d.sq !== undefined) { const i = $('#sq'); i.value = d.sq; topRoute().q = d.sq; render(); return; }
  if (d.bvid) return pushRoute({ name: 'watch', bvid: d.bvid });
  if (d.act) return runMainAction(d.act, el);
  if (d.sact) return runSheetAction(d.sact, el);
});
viewEl.addEventListener('input', e => {
  if (e.target.id === 'sq') {
    topRoute().q = e.target.value;
    const r = topRoute();
    const q = e.target.value.trim().toLowerCase();
    const matched = q ? VIDEOS.filter(v => (v.title+v.owner+v.zone+v.bvid).toLowerCase().includes(q)) : VIDEOS;
    const vl = viewEl.querySelector('.vlist');
    if (vl) vl.innerHTML = matched.length ? matched.map(v => videoCard(v, 'bili:sr')).join('') : `<div class="banner">未找到“${esc(q)}”</div>`;
  }
});

function runMainAction(act, el) {
  if (act === 'togglePlay') return Session.togglePlay();
  if (act === 'rew') return Session.step(-10);
  if (act === 'fwd') return Session.step(10);
  if (act === 'seekMode') return Session.adjusting ? Session.commitAdjust() : Session.beginAdjust();
  if (act === 'openParts') return openPartsSheet(el);
  if (act === 'openSettings') return openSettingsRoot(el);
  if (act === 'openMore') return openMoreSheet(el);
  if (act === 'toggleAdapter') {
    Store.adapter = Store.adapter === 'demo' ? 'iframe' : 'demo'; saveStore(); render();
    toast(Store.adapter === 'demo' ? '已切回：可控演示媒体' : '已切换：B站官方嵌入（能力诚实降级）');
  }
  if (act === 'toggleNet') {
    Store.networkOffline = !Store.networkOffline; saveStore(); render();
    toast(Store.networkOffline ? '已模拟断网' : '已恢复网络');
  }
  if (act === 'openLater') {
    const items = Store.later.map(id => BY[id]).filter(Boolean);
    openSheet({
      title: `稍后再看（${items.length}）`,
      html: items.length ? `<div class="vlist">${items.map(v => videoCard(v,'bili:lt')).join('')}</div>`
        : '<div class="banner">暂无稍后再看。在播放页「更多」中可加入。</div>'
    }, el);
  }
  if (act === 'openOffline') openSheet({
    title: '离线缓存队列',
    html: '<div class="banner"><span><b>当前不可用</b>：离线缓存依赖站点授权、持久存储与到期校验，不能用缓冲或稍后再看替代。</span></div>' +
      '<button class="f opt" data-fid="bili:off:ph" data-sact="openPhoneLogin"><div><div class="otitle">用手机 B站 App 离线缓存</div></div><span class="oval">打开</span></button>'
  }, el);
  if (act === 'openPhoneLogin') openPhoneHandoff(null);
}

function runSheetAction(act, el) {
  const v = BY[Session.bvid], caps = v ? getCapabilities(Store.adapter, v) : {};
  const p = Store.prefs;
  if (act === 'grpVideo') return showSettingsGroup('video');
  if (act === 'grpPlay') return showSettingsGroup('play');
  if (act === 'grpSub') return showSettingsGroup('sub');
  if (act === 'grpDm') return showSettingsGroup('dm');
  if (act === 'grpAudio') return showSettingsGroup('audio');
  if (act === 'grpOffline') return showSettingsGroup('offline');

  if (act === 'toggleMirror') {
    if (!caps.canMirror) return toast(caps.unavailableReason);
    p.mirror = !p.mirror; saveStore(); syncWatchUI(); showSettingsGroup('video', true);
    toast(p.mirror ? '水平镜像：开（字幕不反转）' : '水平镜像：关');
  }
  if (act === 'toggleFit') {
    if (!caps.canMirror) return toast(caps.unavailableReason);
    p.fit = p.fit === 'contain' ? 'fill' : 'contain'; saveStore(); syncWatchUI(); showSettingsGroup('video', true);
  }
  if (act === 'cycleQuality') {
    const qs = ['auto','1080P','720P']; p.quality = qs[(qs.indexOf(p.quality)+1)%qs.length]; saveStore(); showSettingsGroup('video', true);
  }
  if (act === 'cycleRate') {
    if (!caps.canRate) return toast(caps.unavailableReason);
    const rs = [0.5, 0.75, 1, 1.25, 1.5, 2]; p.rate = rs[(rs.indexOf(p.rate)+1)%rs.length]; saveStore(); syncWatchUI(); showSettingsGroup('play', true);
    toast('倍速：' + p.rate + 'x');
  }
  if (act === 'toggleLoop') {
    if (!caps.canPlay) return toast(caps.unavailableReason);
    p.loop = !p.loop; saveStore(); syncWatchUI(); showSettingsGroup('play', true);
  }
  if (act === 'toggleAutoNext') { p.autoNext = !p.autoNext; saveStore(); showSettingsGroup('play', true); }
  if (act === 'toggleSub') {
    if (!caps.canSubtitle) return toast('当前视频无字幕轨道');
    p.subOn = !p.subOn; saveStore(); syncWatchUI(); showSettingsGroup('sub', true);
  }
  if (act === 'toggleSubSize') {
    if (!caps.canSubtitle) return;
    p.subSize = p.subSize === 'md' ? 'lg' : 'md'; saveStore(); syncWatchUI(); showSettingsGroup('sub', true);
  }
  if (act === 'cycleDm') {
    if (!caps.canDanmaku) return toast(caps.unavailableReason);
    const ds = ['off','sparse','standard']; p.dmPreset = ds[(ds.indexOf(p.dmPreset)+1)%ds.length];
    if (p.dmPreset === 'off') { const l = $('#dmLayer'); if (l) l.innerHTML = ''; }
    saveStore(); showSettingsGroup('dm', true);
  }
  if (act === 'pickPart') {
    const idx = Number(el.dataset.idx);
    Session.load(v.bvid, idx);
    sheetStack = []; app.classList.remove('sheet'); $('#shell').inert = false;
    render();
    toast('已切换到 ' + v.parts[idx].title);
  }
  if (act === 'toggleLike') {
    const i = Store.likes.indexOf(v.bvid);
    if (i >= 0) Store.likes.splice(i, 1); else Store.likes.unshift(v.bvid);
    saveStore(); closeSheet(); openMoreSheet(byFid('bili:player:more'));
    toast(i < 0 ? '已点赞（本地演示态）' : '已取消点赞');
  }
  if (act === 'toggleLater') {
    const i = Store.later.indexOf(v.bvid);
    if (i >= 0) Store.later.splice(i, 1); else Store.later.unshift(v.bvid);
    saveStore(); closeSheet(); openMoreSheet(byFid('bili:player:more'));
    toast(i < 0 ? '已加入稍后再看' : '已移出稍后再看');
  }
  if (act === 'openComments') return openCommentsSheet();
  if (act === 'openPhoneVideo') return openPhoneHandoff(v);
  if (act === 'openPhoneLogin') return openPhoneHandoff(null);
  if (act === 'enterImmersive') { closeSheet(); enterImmersive(); }
}

/* ---------- 沉浸模式（焦点操作期间不自动隐藏） ---------- */
function enterImmersive() { app.classList.add('immersive'); clearTimeout(idleTimer); }
function exitImmersive() { app.classList.remove('immersive'); clearTimeout(idleTimer); }
function scheduleImmersive() {
  clearTimeout(idleTimer);
  if (topRoute().name === 'watch' && Session.state === 'playing' && !Session.adjusting && !sheetStack.length) {
    idleTimer = setTimeout(() => {
      if (topRoute().name === 'watch' && Session.state === 'playing' && !Session.adjusting && !sheetStack.length) enterImmersive();
    }, 6000);
  }
}
function resetIdle() { if (topRoute().name === 'watch' && !app.classList.contains('immersive')) scheduleImmersive(); }

/* ---------- Toast / 时钟 ---------- */
let toastT = 0;
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800); }
function tickClock() { const c = $('#clock'); if (c) { const d = new Date(); c.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } }
setInterval(tickClock, 15000);

render();
})();
</script>
